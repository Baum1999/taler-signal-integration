plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlinx-serialization'
    id "org.jetbrains.kotlin.plugin.compose" version "$kotlin_version"
}

android {
    namespace 'net.taler.merchantpos'
    compileSdkVersion 36

    defaultConfig {
        applicationId "net.taler.merchantpos"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 25
        versionName "1.6.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "BACKEND_API_VERSION", "\"20:0:8\"")
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled minify_debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/common.kotlin_module', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError true
        disable 'WrongConstant'
        ignoreWarnings false
    }
}

dependencies {
    implementation project(":merchant-lib")
    implementation project(":taler-kotlin-android")

    implementation "com.google.android.material:material:$material_version"
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayout_version"
    implementation platform('androidx.compose:compose-bom:2026.02.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "androidx.navigation:navigation-compose:$nav_version"
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.recyclerview:recyclerview-selection:1.2.0"

    // CameraX
    implementation "androidx.camera:camera-camera2:1.5.3"
    implementation "androidx.camera:camera-lifecycle:1.5.3"
    implementation "androidx.camera:camera-view:1.5.3"

    // ZXING core – on-device barcode/QR detector
    implementation "com.google.zxing:core:3.5.4"

    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"

    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
