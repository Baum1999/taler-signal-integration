syntax = "proto3";

option java_package = "net.taler.wallet";
option java_multiple_files = true;

enum ScopeInfoType {
  GLOBAL = 0;
  EXCHANGE = 1;
  AUDITOR = 2;
}

message PrefsScopeInfo {
  ScopeInfoType type = 1;
  string currency = 2;
  optional string url = 3;
}

enum PrefsStateFilter {
  NONE = 0;
  FINAL = 1;
  NONFINAL = 2;
  DONE = 3;
}

enum ViewModeType {
  ASSETS = 0;
  TRANSACTIONS = 1;
}

message PrefsViewMode {
  ViewModeType type = 1;

  // TRANSACTIONS
  optional PrefsScopeInfo selectedScope = 2;
  optional string searchQuery = 3;
  optional PrefsStateFilter stateFilter = 4;
}

message UserPreferences {
  optional PrefsScopeInfo selectedScope = 1;
  optional bool actionButtonUsed = 2;
  optional bool devModeEnabled = 3;
  optional bool biometricLockEnabled = 4;
  optional PrefsViewMode viewMode = 5;
}