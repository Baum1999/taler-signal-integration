buildscript {
    ext {
        kotlin_version = '2.3.21' // observe compatibility with compose compiler
        ktor_version = '3.4.0'
        nav_version = '2.9.8'
        material_version = '1.13.0'
        lifecycle_version = '2.10.0'
        constraintlayout_version = '2.2.1'
        junit_version = "4.13.2"
        datastore_version = "1.1.1"
        protobuf_version = "0.9.6"
        // should debug build types be minified with D8 as well? good for catching issues early
        minify_debug = false
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
