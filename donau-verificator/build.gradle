plugins {
    id 'com.android.application'
}

android {
    namespace 'net.taler.donauverificator'
    compileSdk 34

    defaultConfig {
        applicationId "net.taler.donauverificator"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"

        archivesBaseName = "Donau-Verifcation"
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        prefab true
    }

    packagingOptions {
        // Exclude specific files or directories that might cause conflicts
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'

        // Merge specific files if needed
        merge 'META-INF/LGPL2.1'
        merge 'META-INF/AL2.0'

        // Exclude everything under META-INF to avoid conflicts
        resources.excludes.add("META-INF/**/*")
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    // TODO: do not vendor pre-built libsodium
    implementation fileTree(dir: 'src/main/libs/', include: ['libsodium-1.0.19.0.aar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.navigation:navigation-fragment:2.7.5'
    implementation 'androidx.navigation:navigation-ui:2.7.5'
    implementation 'com.github.yuriy-budiyev:code-scanner:2.3.2'
    // https://mvnrepository.com/artifact/org.bouncycastle/bcpkix-jdk18on
    implementation group: 'org.bouncycastle', name: 'bcprov-jdk15on', version: '1.70'
}